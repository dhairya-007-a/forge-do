[build]
  publish = "."
  functions = "netlify/functions"

# publish = "." serves the whole repo root, including internal notes files that
# were never meant to be public. Block them explicitly rather than relying on
# "nothing links to it" (that's how the old ui/netlify-deploy folders sat
# web-accessible for days before anyone noticed).
[[redirects]]
  from = "/main.md"
  to = "/"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Real, edge-enforced admin gate -- unlike the ADMIN_API_KEY header check in
# list-accounts.js/delete-account.js (which is app-level and visible in page
# source), this runs before Netlify even serves the page or invokes the
# function, so a leaked ADMIN_API_KEY alone can't reach these paths.
# (Previously used netlify.toml's `Basic-Auth` header directive here -- that's
# a Pro-plan-only feature that silently no-ops on this site's plan, confirmed
# live by reaching admin-dashboard.html with zero credential prompt. Replaced
# with an Edge Function, which runs on every plan.)
[[edge_functions]]
  path = "/admin-dashboard.html"
  function = "admin-gate"

[[edge_functions]]
  path = "/.netlify/functions/list-accounts"
  function = "admin-gate"

[[edge_functions]]
  path = "/.netlify/functions/delete-account"
  function = "admin-gate"
