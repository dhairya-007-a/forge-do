<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playful Shapes Background</title>
<style>
  :root{
    --cream:#F7EBD3;
    --pink:#F0559C;
    --hotpink:#E8397C;
    --green:#8DC63F;
    --limegreen:#A9D94A;
    --blue:#1B4FA8;
    --steel:#2E6B9E;
    --navy:#20325B;
    --orange:#F5A11B;
    --burnt:#F26B1D;
    --yellow:#FBC418;
    --purple:#C6A1D6;
    --violet:#B48BE0;
    --sky:#7FCBE8;
    --teal:#3FB6A8;
    --coral:#FF7A5C;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--cream);
    overflow-x:hidden;
  }

  @media (prefers-reduced-motion: reduce){
    .shape-bg svg{ animation:none !important; }
  }

  /* ---------- BACKGROUND LAYER ---------- */
  .shape-bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }

  .shape-bg svg{
    position:absolute;
    will-change:transform;
  }

  @keyframes drift-a{
    0%,100%{ transform:translate(0,0) rotate(var(--r,0deg)); }
    50%{ transform:translate(6px,-10px) rotate(calc(var(--r,0deg) + 3deg)); }
  }
  @keyframes drift-b{
    0%,100%{ transform:translate(0,0) rotate(var(--r,0deg)); }
    50%{ transform:translate(-8px,8px) rotate(calc(var(--r,0deg) - 4deg)); }
  }
  @keyframes drift-c{
    0%,100%{ transform:translate(0,0) rotate(var(--r,0deg)); }
    50%{ transform:translate(4px,12px) rotate(var(--r,0deg)); }
  }
  @keyframes spin-slow{
    from{ transform:rotate(var(--r,0deg)); }
    to{ transform:rotate(calc(var(--r,0deg) + 360deg)); }
  }
  @keyframes pulse-soft{
    0%,100%{ transform:scale(1) rotate(var(--r,0deg)); }
    50%{ transform:scale(1.05) rotate(var(--r,0deg)); }
  }

  .layer-back{ opacity:0.9; filter:blur(0.3px); }
  .layer-mid{ opacity:1; }
  .layer-front{ opacity:1; filter:drop-shadow(0 3px 0 rgba(0,0,0,0.03)); }

  /* --- scattered, off-grid, creative composition --- */
  .s1  { top:-6%;  left:-7%;  width:19vw; max-width:250px; --r:-8deg; animation:drift-a 9s ease-in-out infinite; }
  .s2  { top:1%;   left:23%;  width:6.5vw; max-width:88px; --r:0deg; animation:pulse-soft 6s ease-in-out infinite; }
  .s3  { top:-2%;  left:34%;  width:4vw;  max-width:54px; --r:0deg; animation:drift-c 7s ease-in-out infinite; }
  .s4  { top:0%;   left:42%;  width:9vw;  max-width:120px; --r:12deg; animation:spin-slow 40s linear infinite; }
  .s5  { top:-8%;  right:-5%; width:15vw; max-width:200px; --r:0deg; }
  .s6  { top:10%;  left:14%;  width:12vw; max-width:160px; --r:5deg; animation:drift-b 10s ease-in-out infinite; }
  .s7  { top:13%;  left:34%;  width:16vw; max-width:220px; --r:-3deg; animation:drift-a 11s ease-in-out infinite; }
  .s8  { top:6%;   right:8%;  width:7vw;  max-width:95px; --r:20deg; animation:spin-slow 30s linear infinite reverse; }
  .s9  { top:30%;  left:0%;   width:10vw; max-width:135px; --r:-14deg; animation:drift-c 8s ease-in-out infinite; }
  .s10 { top:26%;  left:19%;  width:14vw; max-width:185px; --r:0deg; animation:pulse-soft 7s ease-in-out infinite; }
  .s11 { top:34%;  right:1%;  width:13vw; max-width:175px; --r:0deg; }
  .s12 { top:36%;  left:43%;  width:15vw; max-width:200px; --r:2deg; animation:drift-b 9s ease-in-out infinite; }
  .s13 { top:44%;  right:22%; width:6vw;  max-width:80px; --r:0deg; animation:pulse-soft 5s ease-in-out infinite; }
  .s14 { top:50%;  left:-2%;  width:14vw; max-width:185px; --r:8deg; animation:drift-a 12s ease-in-out infinite; }
  .s15 { top:56%;  left:20%;  width:13vw; max-width:170px; --r:-9deg; animation:drift-c 9s ease-in-out infinite; }
  .s16 { top:54%;  right:14%; width:18vw; max-width:240px; --r:-4deg; }
  .s17 { top:66%;  left:38%;  width:8vw;  max-width:105px; --r:0deg; animation:spin-slow 26s linear infinite; }
  .s18 { top:66%;  left:-1%;  width:13vw; max-width:170px; --r:0deg; }
  .s19 { top:75%;  left:15%;  width:9vw;  max-width:120px; --r:0deg; animation:pulse-soft 6.5s ease-in-out infinite; }
  .s20 { top:73%;  left:32%;  width:5vw;  max-width:66px; --r:0deg; animation:drift-b 6s ease-in-out infinite; }
  .s21 { top:75%;  left:1%;   width:21vw; max-width:270px; --r:0deg; }
  .s22 { top:80%;  right:1%;  width:20vw; max-width:270px; --r:2deg; animation:drift-a 13s ease-in-out infinite; }
  .s23 { top:88%;  left:36%;  width:12vw; max-width:160px; --r:0deg; }
  .s24 { top:16%;  left:-3%;  width:7vw;  max-width:95px; --r:0deg; animation:drift-c 8s ease-in-out infinite; }
  .s25 { top:60%;  left:56%;  width:6vw;  max-width:80px; --r:15deg; animation:spin-slow 34s linear infinite; }
</style>
</head>
<body>

<div class="shape-bg" aria-hidden="true">

  <!-- s1: pink ribbon -->
  <svg class="s1 layer-mid" viewBox="0 0 220 210" xmlns="http://www.w3.org/2000/svg">
    <path fill="var(--pink)" d="M40 0h100c10 0 15 8 15 16v40c0 10-7 16-16 16H90c-6 0-6 9 0 9h35c9 0 16 7 16 16v38c0 9-7 16-16 16H70c-9 0-16-7-16-16V96c0-9 7-16 16-16h29c6 0 6-9 0-9H40C25 71 15 60 15 45V25C15 11 25 0 40 0z"/>
  </svg>

  <!-- s2: green circle -->
  <svg class="s2 layer-front" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="48" fill="var(--green)"/>
  </svg>

  <!-- s3: tiny yellow dot -->
  <svg class="s3 layer-front" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="46" fill="var(--yellow)"/>
  </svg>

  <!-- s4: coral pinwheel -->
  <svg class="s4 layer-mid" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <path fill="var(--coral)" d="M60 60c0-30 10-55 30-55 15 0 20 15 10 25-10-15-25-10-25 10 20-10 40 0 40 20 0 15-15 20-25 10 15 10 10 25-10 25 10-20 0-40-20-40 10 20 0 40-20 40-15 0-20-15-10-25 10 15 25 10 25-10-20 10-40 0-40-20 0-15 15-20 25-10-15-10-10-25 10-25-10 20 0 40 20 40z"/>
  </svg>

  <!-- s5: green arch -->
  <svg class="s5 layer-back" viewBox="0 0 180 200" xmlns="http://www.w3.org/2000/svg">
    <path fill="var(--limegreen)" d="M10 200V90C10 40 45 5 90 5s80 35 80 85v110H10z"/>
  </svg>

  <!-- s6: purple pebble -->
  <svg class="s6 layer-mid" viewBox="0 0 160 170" xmlns="http://www.w3.org/2000/svg">
    <path fill="var(--purple)" d="M75 5c35-4 70 22 74 62 3 34-18 66-53 78-30 11-66-2-82-33C-3 78 8 41 38 18 49 9 62 6 75 5z"/>
  </svg>

  <!-- s7: blue starfish blob -->
  <svg class="s7 layer-mid" viewBox="0 0 240 170" xmlns="http://www.w3.org/2000/svg">
    <path fill="var(--blue)" d="M60 10c15-15 35-5 40 8 8-18 32-22 44-6 10-14 34-12 40 5 10-10 28-4 30 12 2 12-6 20-16 22 12 6 16 22 6 32-8 8-20 6-28-1-2 14-18 24-32 18-10-4-14-14-12-24-14 10-34 4-38-12-10 12-30 10-36-4-10 8-24 2-24-12 0-8 6-14 14-16-10-6-14-18-6-28 6-8 16-8 18 6z"/>
  </svg>

  <!-- s8: teal spiral -->
  <svg class="s8 layer-front" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path fill="none" stroke="var(--teal)" stroke-width="12" stroke-linecap="round"
          d="M50 50c0-16 13-22 22-16s10 22-2 26-24-6-20-20 20-24 34-14"/>
  </svg>

  <!-- s9: green star -->
  <svg class="s9 layer-front" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <path fill="var(--green)" d="M60 5l14 32 35 3-27 23 9 34-31-19-31 19 9-34-27-23 35-3z"/>
  </svg>

  <!-- s10: steel mountain -->
  <svg class="s10 layer-mid" viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg">
    <path fill="var(--steel)" d="M95 8c5-9 15-9 20 0l70 138c5 10-2 20-13 20H36c-11 0-18-10-13-20z"/>
  </svg>

  <!-- s11: orange squiggle -->
  <svg class="s11 layer-back" viewBox="0 0 140 260" xmlns="http://www.w3.org/2000/svg">
    <path fill="var(--orange)" d="M40 0c40 0 60 20 60 45S80 90 60 90s-20 15 0 15 60 15 60 45-20 45-60 45-60-15-60-45c0-10 30-10 30 0 0 15 15 20 30 20s30-10 30-20-15-20-30-20-40-15-40-40 20-40 40-40-30-15-30-45C30 15 20 0 40 0z"/>
  </svg>

  <!-- s12: sky ellipse -->
  <svg class="s12 layer-mid" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="100" cy="70" rx="95" ry="62" fill="var(--sky)"/>
  </svg>

  <!-- s13: hotpink dot cluster -->
  <svg class="s13 layer-front" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="30" cy="35" r="22" fill="var(--hotpink)"/>
    <circle cx="68" cy="60" r="14" fill="var(--hotpink)"/>
  </svg>

  <!-- s14: burnt-orange crescent -->
  <svg class="s14 layer-mid" viewBox="0 0 160 150" xmlns="http://www.w3.org/2000/svg">
    <path fill="var(--burnt)" d="M120 10C70-6 20 22 6 68c-14 45 12 92 58 108 30 10 62 2 84-18-38 6-74-18-84-52-10-33 6-68 36-84 6-3 13-6 20-12z"/>
  </svg>

  <!-- s15: violet star burst -->
  <svg class="s15 layer-front" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <path fill="var(--violet)" d="M100 0l14 62 55-32-32 55 62 14-62 14 32 55-55-32-14 62-14-62-55 32 32-55L0 114l62-14-32-55 55 32z"/>
  </svg>

  <!-- s16: pink squiggle -->
  <svg class="s16 layer-mid" viewBox="0 0 260 140" xmlns="http://www.w3.org/2000/svg">
    <path fill="var(--pink)" d="M0 60c15-40 45-40 60-10s15 40 30 10 45-40 60-10 15 40 30 10 45-40 60-10c10 18 10 18 20 30l-20 30c-15-30-45-30-60 0s-15-40-30-10-45 40-60 10-15 40-30 10S15 90 0 60z"/>
  </svg>

  <!-- s17: navy diamond -->
  <svg class="s17 layer-front" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path fill="var(--navy)" d="M50 4l46 46-46 46L4 50z"/>
  </svg>

  <!-- s18: blue rounded rectangle -->
  <svg class="s18 layer-mid" viewBox="0 0 200 90" xmlns="http://www.w3.org/2000/svg">
    <rect x="4" y="4" width="192" height="82" rx="14" fill="var(--blue)"/>
  </svg>

  <!-- s19: coral blob (organic droplet) -->
  <svg class="s19 layer-mid" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
    <path fill="var(--coral)" d="M70 4c40 0 66 32 66 66 0 30-22 62-58 66-38 4-70-20-76-56C-4 40 24 4 70 4z"/>
  </svg>

  <!-- s20: yellow star sparkle -->
  <svg class="s20 layer-front" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
    <path fill="var(--yellow)" d="M40 0l6 30 30 6-30 6-6 30-6-30-30-6 30-6z"/>
  </svg>

  <!-- s21: yellow bar -->
  <svg class="s21 layer-back" viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg">
    <rect x="4" y="4" width="272" height="72" rx="10" fill="var(--yellow)"/>
  </svg>

  <!-- s22: sky wave -->
  <svg class="s22 layer-mid" viewBox="0 0 300 90" xmlns="http://www.w3.org/2000/svg">
    <path fill="none" stroke="var(--sky)" stroke-width="34" stroke-linecap="round"
          d="M10 60c30-40 60-40 90 0s60 40 90 0 60-40 90 0"/>
  </svg>

  <!-- s23: teal blob mid-page -->
  <svg class="s23 layer-mid" viewBox="0 0 180 140" xmlns="http://www.w3.org/2000/svg">
    <path fill="var(--teal)" d="M90 6c46 0 84 30 84 66 0 32-30 60-68 66-42 6-80-16-90-52C4 46 34 12 74 7c5-1 11-1 16-1z"/>
  </svg>

  <!-- s24: green triangle -->
  <svg class="s24 layer-front" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path fill="var(--green)" d="M50 6l44 88H6z"/>
  </svg>

  <!-- s25: purple plus / sparkle -->
  <svg class="s25 layer-front" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
    <path fill="var(--violet)" d="M35 0h10v35h35v10H45v35H35V45H0V35h35z"/>
  </svg>

</div>

</body>
</html>
